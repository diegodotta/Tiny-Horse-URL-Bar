<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Bar Runner</title>
    <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
    <div class="game">
      <div id="hud" class="tiny-horse">
        <div class="hud-row hud-url">
          <div id="url-display"></div>
          <div class="url-zoom">
            <button id="url-font-minus" type="button" class="hud-button" aria-label="Decrease URL font size">−</button>
            <button id="url-font-plus" type="button" class="hud-button" aria-label="Increase URL font size">+</button>
          </div>
        </div>
        <div class="hud-row hud-instructions">
          <span id="instructions">Loading...</span>
          <button id="toggle-url" type="button" class="hud-button">Show URL</button>
        </div>
        <div class="hud-row hud-stats">
          <span id="score">Score: 00</span>
          <span id="high">High score: 00 </span>
          <button id="share" type="button" class="hud-button">Share</button>
        </div>
        <div id="mobile-controls" class="controls touch-only">
          <button id="mobile-restart-btn" class="icon-button">Restart</button>
          <button id="mobile-jump-btn" class="icon-button">Jump</button>
        </div>
        <div class="hud-row hud-credits">
          <span >Tiny Horse Bar by <a href="https://diego.horse" target="_blank">diego.horse</a>. Open source on <a href="https://github.com/diegodotta/tiny-horse-url-bar" target="_blank">GitHub</a>. Made with <a href="https://en.wikipedia.org/wiki/Braille_Patterns" target="_blank">Braille</a> and ❤️</span>
        </div>
      </div>
    </div>
    <script>
        const domain = '.';
    </script>

    <script src="./game.js"></script>
</body>
</html>
